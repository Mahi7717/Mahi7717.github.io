<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Perfume by Haram - Admin</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f1e8;
            margin: 0;
            padding: 30px;
        }


        /* LOGIN */

        .login-box {

            max-width: 400px;

            margin: 80px auto;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);

        }


        h1 {

            text-align: center;

        }


        input {

            width: 100%;

            padding: 12px;

            margin: 10px 0;

            box-sizing: border-box;

        }


        button {

            padding: 12px 20px;

            margin-top: 10px;

            cursor: pointer;

            border: none;

            border-radius: 6px;

        }


        /* DASHBOARD */

        #dashboard {

            display: none;

        }


        .dashboard-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .logout-btn {

            background: #222;

            color: white;

            width: auto;

        }


        .table-container {

            width: 100%;

            overflow-x: auto;

        }


        table {

            width: 100%;

            min-width: 1100px;

            border-collapse: collapse;

            background: white;

        }


        th,
        td {

            border: 1px solid #ccc;

            padding: 10px;

            text-align: left;

        }


        th {

            background: #eee;

            white-space: nowrap;

        }


        td {

            vertical-align: top;

        }


        select {

            padding: 7px;

            cursor: pointer;

        }


        #loginMessage {

            text-align: center;

            color: red;

        }

    </style>

</head>


<body>


<!-- ================================ -->
<!-- LOGIN -->
<!-- ================================ -->

<div id="loginBox" class="login-box">

    <h1>🌿 Admin Login</h1>


    <input
        type="email"
        id="email"
        placeholder="Admin Email"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <button onclick="loginAdmin()">

        Login

    </button>


    <p id="loginMessage"></p>

</div>



<!-- ================================ -->
<!-- DASHBOARD -->
<!-- ================================ -->

<div id="dashboard">


    <div class="dashboard-top">

        <h1>
            Perfume by Haram - Orders Dashboard
        </h1>


        <button
            class="logout-btn"
            onclick="logoutAdmin()"
        >

            Logout

        </button>

    </div>



    <div class="table-container">

        <table>


            <thead>

                <tr>

                    <th>Order ID</th>

                    <th>Date</th>

                    <th>Customer</th>

                    <th>Phone</th>

                    <th>Address</th>

                    <th>Products</th>

                    <th>Quantity</th>

                    <th>Total</th>

                    <th>Status</th>

                    <th>Payment Method</th>

                </tr>

            </thead>


            <tbody id="ordersTable">

            </tbody>


        </table>

    </div>


</div>



<!-- ================================ -->
<!-- SUPABASE -->
<!-- ================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- ADMIN JAVASCRIPT -->

<script src="admin.js?v=3"></script>


</body>

</html>
